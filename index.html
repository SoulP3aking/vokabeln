<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vokabeln</title>
<meta name="description" content="Vokabelhefte anlegen, üben und nachschlagen – offline und lokal.">
<meta name="theme-color" content="#EFEADD">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<header class="topbar glass">
  <div class="topbar-inner">
    <button class="icon-btn back-btn" id="btnBack" hidden aria-label="Zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h1 id="viewTitle">Hefte</h1>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.7-1.3-2-3.4-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.2 3H9.8l-.3 2.1a7.6 7.6 0 0 0-2.6 1.5l-2-.8-2 3.4 1.7 1.3a7.6 7.6 0 0 0 0 3L2.9 15l2 3.4 2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.1h4.4l.3-2.1a7.6 7.6 0 0 0 2.6-1.5l2 .8 2-3.4-1.7-1.3Z"/></svg>
    </button>
  </div>
</header>

<main id="main">

  <!-- ── HEFTE ───────────────────────────────────────── -->
  <section class="view" id="view-books" data-title="Hefte">
    <div id="booksContent"></div>
  </section>

  <!-- ── EIN HEFT ────────────────────────────────────── -->
  <section class="view" id="view-book" data-title="Heft" hidden>
    <div id="bookHeader"></div>
    <div class="glass card search-card">
      <div class="search-row">
        <svg class="search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
        <input type="text" id="wordSearch" placeholder="Im Heft suchen …" autocomplete="off" enterkeyhint="search">
        <button class="icon-btn clear-btn" id="clearSearch" hidden aria-label="Suche leeren">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="seg" id="wordFilter">
        <button class="seg-btn is-active" data-wf="all">Alle</button>
        <button class="seg-btn" data-wf="hard">Schwierig</button>
        <button class="seg-btn" data-wf="due">Fällig</button>
      </div>
    </div>
    <div id="wordsContent"></div>
  </section>

  <!-- ── ÜBEN ────────────────────────────────────────── -->
  <section class="view" id="view-train" data-title="Üben" hidden>
    <div id="trainContent"></div>
  </section>

  <!-- ── NACHSCHLAGEN ────────────────────────────────── -->
  <section class="view" id="view-dict" data-title="Nachschlagen" hidden>
    <div class="glass card search-card">
      <div class="search-row">
        <svg class="search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
        <input type="text" id="dictSearch" placeholder="Wort eingeben …" autocomplete="off" autocapitalize="off" enterkeyhint="search">
        <button class="icon-btn clear-btn" id="clearDict" hidden aria-label="Suche leeren">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="hint" id="dictHint"></p>
    </div>
    <div id="dictContent"></div>
  </section>

  <!-- ── EINSTELLUNGEN ───────────────────────────────── -->
  <section class="view" id="view-settings" data-title="Einstellungen" hidden>
    <div class="glass card">
      <h2>Datensicherung</h2>
      <p class="hint">Alle Vokabeln liegen nur auf diesem Gerät. Sichere sie regelmäßig – iOS kann den Speicher löschen, wenn die App lange ungenutzt bleibt.</p>
      <label class="check-line">
        <input type="checkbox" id="exportImages" checked>
        <span>Bilder mitsichern <em id="imgSizeHint"></em></span>
      </label>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnExport">Exportieren</button>
        <button class="btn btn-soft" id="btnImport">Importieren</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>

    <div class="glass card">
      <h2>Aussprache</h2>
      <label class="check-line">
        <input type="checkbox" id="ttsEnabled" checked>
        <span>Vorlese-Knopf anzeigen</span>
      </label>
      <p class="hint" id="ttsHint"></p>
    </div>

    <div class="glass card">
      <h2>Wörterbuch</h2>
      <p class="hint" id="dictInfo"></p>
    </div>

    <div class="glass card">
      <h2>Speicher</h2>
      <p class="hint" id="storageInfo"></p>
      <div class="btn-row">
        <button class="btn btn-soft" id="btnResetBoxes">Lernfortschritt zurücksetzen</button>
      </div>
    </div>

    <div class="glass card">
      <h2>Über</h2>
      <p class="hint">Vokabeln · Version <span id="appVersion"></span><br>Funktioniert vollständig offline. Keine Konten, keine Server, keine Werbung.</p>
    </div>
  </section>

</main>

<button class="fab" id="fab" aria-label="Neues Heft">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>

<nav class="tabbar glass" id="tabbar">
  <button class="tab is-active" data-view="books">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a1.7 1.7 0 0 0-1.7-1.5H5.5A1.5 1.5 0 0 1 4 16V5.5Z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a1.7 1.7 0 0 1 1.7-1.5h4.8A1.5 1.5 0 0 0 20 16V5.5Z"/></svg>
    <span>Hefte</span>
  </button>
  <button class="tab" data-view="train">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 14.3 9l5 .7-3.6 3.5.9 4.9-4.6-2.4-4.6 2.4.9-4.9L4.7 9.7l5-.7L12 4.5Z"/></svg>
    <span>Üben</span>
  </button>
  <button class="tab" data-view="dict">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
    <span>Nachschlagen</span>
  </button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet glass" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Schließen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/dict.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/train.js"></script>
<script src="js/app.js"></script>
</body>
</html>
